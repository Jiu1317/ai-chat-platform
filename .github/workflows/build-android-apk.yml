name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "clients/android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: ""

      - name: Install Android 17 preview SDK
        run: |
          android sdk install "platforms/android-37.0"
          android sdk install "build-tools/36.0.0"

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Check source and build debug APK
        run: ./gradlew --no-daemon lintDebug assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: AIChat-Android-debug
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
